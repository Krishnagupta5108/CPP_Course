<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Simple Pong</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --bg:#0b1020;
      --field:#071028;
      --accent:#61dafb;
      --muted:#9aa9c7;
    }
    html,body{
      height:100%;
      margin:0;
      font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:linear-gradient(180deg, #051026 0%, #06122a 100%);
      color:var(--muted);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .container{
      text-align:center;
      width:880px;
      max-width:96vw;
    }
    h1{
      margin:10px 0 6px;
      color:var(--accent);
      font-weight:600;
      font-size:20px;
    }
    .rules{
      margin:0 0 12px 0;
      font-size:13px;
      color:var(--muted);
    }
    .board{
      background:var(--field);
      padding:12px;
      border-radius:8px;
      box-shadow:0 6px 30px rgba(2,8,20,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
    }
    canvas{
      display:block;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00));
      margin:0 auto;
      border-radius:4px;
      cursor:crosshair;
      box-shadow:0 8px 20px rgba(2,8,20,0.6);
    }
    .footer{
      margin-top:10px;
      font-size:13px;
      color:var(--muted);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .hint{ color:var(--muted); }
    .credits{ color: #7fb1d9; font-size:12px; }
    @media (max-width:520px){
      h1{ font-size:16px; }
      .footer{ flex-direction:column; gap:6px; align-items:center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Simple Pong — Mouse & Arrow Keys (Left) vs Computer (Right)</h1>
    <p class="rules">Move your left paddle with the mouse or Up/Down arrow keys. First to any score — continuous play.</p>
    <div class="board">
      <canvas id="game" width="800" height="500" aria-label="Pong game canvas"></canvas>
      <div class="footer">
        <div class="hint">Controls: Mouse move or ↑ ↓ keys to move left paddle</div>
        <div class="credits">Built with HTML / CSS / JavaScript</div>
      </div>
    </div>
  </div>

  <script>
    // Canvas & context
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const W = canvas.width;
    const H = canvas.height;

    // Game objects
    const paddleWidth = 12;
    const paddleHeight = 100;
    const paddleMargin = 10;

    const leftPaddle = {
      x: paddleMargin,
      y: (H - paddleHeight) / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: 6
    };

    const rightPaddle = {
      x: W - paddleMargin - paddleWidth,
      y: (H - paddleHeight) / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: 4.2 // computer reaction speed
    };

    const ball = {
      x: W / 2,
      y: H / 2,
      r: 8,
      speed: 5,
      vx: 5,
      vy: 0
    };

    let leftScore = 0;
    let rightScore = 0;

    // Input state
    let upPressed = false;
    let downPressed = false;
    let mouseActive = false;

    // Initialize ball direction randomly
    function resetBall(servingToRight = Math.random() >= 0.5) {
      ball.x = W / 2;
      ball.y = H / 2;
      ball.speed = 5;
      const angle = (Math.random() * Math.PI / 4) - (Math.PI / 8); // -22.5deg..22.5deg
      ball.vx = (servingToRight ? 1 : -1) * ball.speed * Math.cos(angle);
      ball.vy = ball.speed * Math.sin(angle);
    }

    resetBall();

    // Handle mouse movement to control left paddle
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseY = e.clientY - rect.top;
      leftPaddle.y = mouseY - leftPaddle.height / 2;
      clampPaddles();
      mouseActive = true;
    });

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'Up') { upPressed = true; mouseActive = false; }
      if (e.key === 'ArrowDown' || e.key === 'Down') { downPressed = true; mouseActive = false; }
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'Up') { upPressed = false; }
      if (e.key === 'ArrowDown' || e.key === 'Down') { downPressed = false; }
    });

    // Keep paddles inside field
    function clampPaddles() {
      leftPaddle.y = Math.max(0, Math.min(H - leftPaddle.height, leftPaddle.y));
      rightPaddle.y = Math.max(0, Math.min(H - rightPaddle.height, rightPaddle.y));
    }

    // Collision between circle (ball) and rect (paddle)
    function ballHitsPaddle(ball, paddle) {
      // Find closest point on paddle to ball center
      const closestX = Math.max(paddle.x, Math.min(ball.x, paddle.x + paddle.width));
      const closestY = Math.max(paddle.y, Math.min(ball.y, paddle.y + paddle.height));
      const dx = ball.x - closestX;
      const dy = ball.y - closestY;
      return (dx * dx + dy * dy) <= (ball.r * ball.r);
    }

    // Game update
    function update() {
      // Left paddle movement via keys (only if not using mouse actively)
      if (!mouseActive) {
        if (upPressed) leftPaddle.y -= leftPaddle.speed;
        if (downPressed) leftPaddle.y += leftPaddle.speed;
        clampPaddles();
      }

      // Simple AI for right paddle: move towards ball's Y with some max speed
      const targetY = ball.y - rightPaddle.height / 2;
      const diff = targetY - rightPaddle.y;
      const aiStep = Math.sign(diff) * Math.min(Math.abs(diff), rightPaddle.speed);
      rightPaddle.y += aiStep;
      clampPaddles();

      // Move ball
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top/bottom collision
      if (ball.y - ball.r <= 0) {
        ball.y = ball.r;
        ball.vy *= -1;
      } else if (ball.y + ball.r >= H) {
        ball.y = H - ball.r;
        ball.vy *= -1;
      }

      // Left paddle collision
      if (ball.vx < 0 && ballHitsPaddle(ball, leftPaddle)) {
        // place outside paddle to avoid sticking
        ball.x = leftPaddle.x + leftPaddle.width + ball.r;
        // reflect with spin based on hit position
        const relativeIntersectY = (leftPaddle.y + leftPaddle.height / 2) - ball.y;
        const normalized = relativeIntersectY / (leftPaddle.height / 2);
        const maxBounceAngle = Math.PI / 3; // 60 degrees
        const bounceAngle = normalized * maxBounceAngle;
        const speedIncrease = 0.5;
        ball.speed = Math.min(12, ball.speed + speedIncrease);
        ball.vx = Math.abs(ball.speed * Math.cos(bounceAngle));
        ball.vy = -ball.speed * Math.sin(bounceAngle);
      }

      // Right paddle collision
      if (ball.vx > 0 && ballHitsPaddle(ball, rightPaddle)) {
        ball.x = rightPaddle.x - ball.r;
        const relativeIntersectY = (rightPaddle.y + rightPaddle.height / 2) - ball.y;
        const normalized = relativeIntersectY / (rightPaddle.height / 2);
        const maxBounceAngle = Math.PI / 3;
        const bounceAngle = normalized * maxBounceAngle;
        const speedIncrease = 0.45;
        ball.speed = Math.min(12, ball.speed + speedIncrease);
        ball.vx = -Math.abs(ball.speed * Math.cos(bounceAngle));
        ball.vy = -ball.speed * Math.sin(bounceAngle);
      }

      // Score: left misses
      if (ball.x + ball.r < 0) {
        rightScore++;
        resetBall(true); // send to right (computer serves)
        mouseActive = false;
      }

      // Score: right misses
      if (ball.x - ball.r > W) {
        leftScore++;
        resetBall(false); // player serves
        mouseActive = false;
      }
    }

    // Draw everything
    function draw() {
      // Clear
      ctx.fillStyle = '#06122a';
      ctx.fillRect(0, 0, W, H);

      // Center dashed line
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 14]);
      ctx.beginPath();
      ctx.moveTo(W / 2, 0);
      ctx.lineTo(W / 2, H);
      ctx.stroke();
      ctx.setLineDash([]);

      // Scoreboard
      ctx.fillStyle = '#bfe9ff';
      ctx.font = '28px system-ui, -apple-system, "Segoe UI", Roboto';
      ctx.textAlign = 'center';
      ctx.fillText(leftScore + '  —  ' + rightScore, W / 2, 36);

      // Paddles
      ctx.fillStyle = '#9fd7ff';
      roundRect(ctx, leftPaddle.x, leftPaddle.y, leftPaddle.width, leftPaddle.height, 6, true, false);
      roundRect(ctx, rightPaddle.x, rightPaddle.y, rightPaddle.width, rightPaddle.height, 6, true, false);

      // Ball
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      // Small HUD
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.font = '12px system-ui, -apple-system, "Segoe UI", Roboto';
      ctx.textAlign = 'left';
      ctx.fillText('Left: You', 8, H - 12);
      ctx.textAlign = 'right';
      ctx.fillText('Right: Computer', W - 8, H - 12);
    }

    // Utility: rounded rectangle
    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
      if (typeof r === 'undefined') r = 5;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    // Loop
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // Start game
    loop();

    // Make canvas responsive-ish: keep drawing size fixed but scale via CSS if needed.
    // Prevent text selection while using arrow keys in some browsers
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp','ArrowDown','Up','Down',' '].includes(e.key)) e.preventDefault();
    });
  </script>
</body>
</html>
